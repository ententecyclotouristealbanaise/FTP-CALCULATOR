<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calculateur FTP</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FTP Calc">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14181f;
    --panel: #1b212b;
    --panel-2: #202834;
    --line: #2b3542;
    --ink: #e7ecf2;
    --ink-dim: #8b97a7;
    --accent: #5fd0c9;
    --accent-dim: #2c4e4c;

    --z1: #5b6b7c;
    --z2: #5fd0c9;
    --z3: #6fd45e;
    --z4: #e8c547;
    --z5: #ef9a4d;
    --z6: #ea5f5f;
    --z7: #b26fef;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Inter', -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #1c2531 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #1a2a29 0%, transparent 40%),
      var(--bg);
    color:var(--ink);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .device{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px 22px 26px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand .name{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }
  .brand .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  .brand .row{ display:flex; align-items:center; gap:8px; }

  /* --- Digital readout, cyclo-computer style --- */
  .readout{
    background: #0e1319;
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 20px 18px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .readout::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .readout .watts{
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size:64px;
    line-height:1;
    letter-spacing:-0.02em;
    color:var(--accent);
    text-shadow: 0 0 24px rgba(95,208,201,0.35);
    transition: color .25s ease, text-shadow .25s ease;
  }
  .readout .unit{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--ink-dim);
    margin-top:6px;
    text-transform:uppercase;
  }
  .readout .wkg{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:var(--ink-dim);
    margin-top:10px;
    letter-spacing:.02em;
  }
  .readout .wkg strong{
    color:var(--ink);
    font-weight:700;
  }
  .readout .zonebadge{
    display:inline-block;
    margin-top:14px;
    padding:6px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
  }

  /* --- FTP + poids input --- */
  .field{ margin-top:20px; }
  .field-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    margin-top:20px;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:8px;
    font-weight:600;
  }
  .ftp-wrap, .weight-wrap{
    display:flex;
    align-items:center;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
  }
  .ftp-wrap input[type="number"], .weight-wrap input[type="number"]{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    font-weight:700;
    padding:10px 8px;
    width:100%;
    min-width:0;
    -moz-appearance: textfield;
  }
  .ftp-wrap input[type=number]::-webkit-outer-spin-button,
  .ftp-wrap input[type=number]::-webkit-inner-spin-button,
  .weight-wrap input[type=number]::-webkit-outer-spin-button,
  .weight-wrap input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .ftp-wrap .suffix, .weight-wrap .suffix{
    color:var(--ink-dim);
    font-size:13px;
    padding-right:12px;
    font-family:'JetBrains Mono', monospace;
  }

  /* --- Percent stepper --- */
  .percent-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .percent-value{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .stepbtn{
    flex:0 0 auto;
    width:42px; height:42px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink);
    font-size:20px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .stepbtn:active{ transform: scale(0.92); }
  .stepbtn:hover{ border-color: var(--accent); color:var(--accent); }
  .stepbtn.small{ font-size:12px; font-weight:600; width:38px; height:38px; color:var(--ink-dim); }

  .slider-wrap{ flex:1; padding: 0 2px; }
  input[type="range"]{
    -webkit-appearance:none;
    width:100%;
    height:6px;
    border-radius:4px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--fill,50%), var(--panel-2) var(--fill,50%), var(--panel-2) 100%);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px;
    border-radius:50%;
    background: var(--ink);
    border:3px solid var(--accent);
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  input[type="range"]::-moz-range-thumb{
    width:20px; height:20px;
    border-radius:50%;
    background: var(--ink);
    border:3px solid var(--accent);
    cursor:pointer;
  }

  /* --- Zone gauge (signature element) --- */
  .gauge{
    margin-top:24px;
  }
  .gauge-track{
    position:relative;
    display:flex;
    height:34px;
    border-radius:8px;
    overflow:visible;
    gap:2px;
  }
  .gauge-seg{
    border-radius:5px;
    background: var(--seg-color);
    opacity:0.28;
    transition: opacity .2s ease;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gauge-seg.active{ opacity:1; }
  .gauge-seg .seg-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    font-weight:700;
    color:#0e1319;
    letter-spacing:.02em;
  }
  .gauge-marker{
    position:absolute;
    top:-6px;
    width:2px;
    height:46px;
    background:var(--ink);
    left:0%;
    transform:translateX(-1px);
    transition: left .2s ease;
    box-shadow: 0 0 6px rgba(255,255,255,0.5);
  }
  .gauge-marker::after{
    content:"";
    position:absolute;
    top:-5px; left:50%;
    width:8px; height:8px;
    background:var(--ink);
    border-radius:50%;
    transform:translateX(-50%);
  }

  /* --- Zone table --- */
  .zones{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .zone-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:11px 12px;
    border-radius:10px;
    background:var(--panel-2);
    border:1px solid transparent;
    transition: border-color .15s, background .15s;
  }
  .zone-row.current{
    border-color: var(--row-color);
    background: color-mix(in srgb, var(--row-color) 12%, var(--panel-2));
  }
  .zone-row .zhead{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .zone-row .chip{
    width:8px; height:8px;
    border-radius:3px;
    background:var(--row-color);
    flex:0 0 auto;
  }
  .zone-row .zname{
    flex:1;
    color:var(--ink);
    font-weight:600;
    font-size:13px;
  }
  .zone-row .zpercent-inline{
    color:var(--ink-dim);
    font-size:11px;
    font-family:'JetBrains Mono', monospace;
    flex:0 0 auto;
  }
  .zone-row .zstats{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:8px;
    padding-left:16px;
  }
  .zone-row .zstat{
    background:rgba(0,0,0,0.18);
    border-radius:7px;
    padding:6px 9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  .zone-row .zstat .stat-tag{
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }
  .zone-row .zstat .stat-val{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    color:var(--ink);
    font-size:12.5px;
    white-space:nowrap;
  }

  @media (max-width:380px){
    .readout .watts{ font-size:52px; }
    .zone-row .zstat .stat-val{ font-size:11.5px; }
  }
</style>
</head>
<body>

<div class="device">

  <div class="brand">
    <div class="row"><div class="dot"></div><div class="name">Calculateur FTP</div></div>
    <div class="name" id="clock">⚡</div>
  </div>

  <div class="readout">
    <div class="watts" id="wattsResult">188</div>
    <div class="unit">watts cible</div>
    <div class="wkg" id="wkgResult">— w/kg</div>
    <div class="zonebadge" id="zoneLabel"></div>
  </div>

  <div class="field-row">
    <div>
      <label for="ftp">Ma FTP</label>
      <div class="ftp-wrap">
        <input type="number" id="ftp" value="250" min="1" inputmode="numeric">
        <span class="suffix">W</span>
      </div>
    </div>
    <div>
      <label for="weight">Mon poids</label>
      <div class="weight-wrap">
        <input type="number" id="weight" value="70" min="1" step="0.1" inputmode="decimal">
        <span class="suffix">kg</span>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="percent-head">
      <label for="percent" style="margin:0;">Intensité</label>
      <span class="percent-value" id="percentLabel">75%</span>
    </div>
    <div class="stepper">
      <div class="stepbtn small" id="minus5" title="-5%">−5</div>
      <div class="stepbtn" id="minus1" title="-1%">−</div>
      <div class="slider-wrap">
        <input type="range" id="percent" min="0" max="200" value="75" step="1">
      </div>
      <div class="stepbtn" id="plus1" title="+1%">+</div>
      <div class="stepbtn small" id="plus5" title="+5%">+5</div>
    </div>
  </div>

  <div class="gauge">
    <div class="gauge-track" id="gaugeTrack"></div>
    <div class="gauge-marker" id="gaugeMarker"></div>
  </div>

  <div class="zones" id="zoneTable"></div>

</div>

<script>
  // Modèle 7 zones de Coggan, bornes en % de FTP
  const ZONES = [
    { key:'z1', name:'Récupération active', min:0,   max:55,  color:'var(--z1)' },
    { key:'z2', name:'Endurance',            min:55,  max:75,  color:'var(--z2)' },
    { key:'z3', name:'Tempo',                min:76,  max:90,  color:'var(--z3)' },
    { key:'z4', name:'Seuil',                min:91,  max:105, color:'var(--z4)' },
    { key:'z5', name:'VO2max',               min:106, max:120, color:'var(--z5)' },
    { key:'z6', name:'Anaérobie',            min:121, max:150, color:'var(--z6)' },
    { key:'z7', name:'Neuromusculaire',      min:151, max:200, color:'var(--z7)' },
  ];
  const GAUGE_MAX = 200;

  const ftpInput = document.getElementById('ftp');
  const weightInput = document.getElementById('weight');
  const percentInput = document.getElementById('percent');
  const percentLabel = document.getElementById('percentLabel');
  const wattsResult = document.getElementById('wattsResult');
  const wkgResult = document.getElementById('wkgResult');
  const zoneLabel = document.getElementById('zoneLabel');
  const gaugeTrack = document.getElementById('gaugeTrack');
  const gaugeMarker = document.getElementById('gaugeMarker');
  const zoneTable = document.getElementById('zoneTable');

  // Construit les segments de la jauge une seule fois (proportionnels à la largeur en %)
  ZONES.forEach((z, i) => {
    const seg = document.createElement('div');
    seg.className = 'gauge-seg';
    seg.style.setProperty('--seg-color', z.color);
    seg.style.flex = (z.max - z.min);
    seg.dataset.key = z.key;
    seg.innerHTML = `<span class="seg-label">Z${i+1}</span>`;
    gaugeTrack.appendChild(seg);
  });

  // Construit les lignes du tableau de zones une seule fois
  ZONES.forEach((z, i) => {
    const row = document.createElement('div');
    row.className = 'zone-row';
    row.style.setProperty('--row-color', z.color);
    row.dataset.key = z.key;
    row.innerHTML = `
      <div class="zhead">
        <div class="chip"></div>
        <div class="zname">Z${i+1} · ${z.name}</div>
        <div class="zpercent-inline">${z.min}–${z.max === 200 ? '200+' : z.max}%</div>
      </div>
      <div class="zstats">
        <div class="zstat"><span class="stat-tag">Watts</span><span class="stat-val" data-watts></span></div>
        <div class="zstat"><span class="stat-tag">W/kg</span><span class="stat-val" data-wkg></span></div>
      </div>
    `;
    zoneTable.appendChild(row);
  });

  function getZone(percent){
    for (const z of ZONES){
      if (percent <= z.max || z === ZONES[ZONES.length-1]) return z;
    }
    return ZONES[ZONES.length-1];
  }

  function calculate(){
    const ftp = Math.max(0, parseFloat(ftpInput.value) || 0);
    const weight = Math.max(0, parseFloat(weightInput.value) || 0);
    let percent = parseFloat(percentInput.value) || 0;
    percent = Math.min(GAUGE_MAX, Math.max(0, percent));

    const watts = Math.round(ftp * percent / 100);
    percentLabel.textContent = percent + '%';
    wattsResult.textContent = watts;
    wkgResult.innerHTML = weight > 0
      ? `<strong>${(watts / weight).toFixed(2)}</strong> w/kg`
      : '— w/kg';

    // Remplissage visuel du slider
    percentInput.style.setProperty('--fill', (percent / GAUGE_MAX * 100) + '%');

    const zone = getZone(percent);
    const zoneIndex = ZONES.indexOf(zone) + 1;
    zoneLabel.textContent = `Z${zoneIndex} · ${zone.name}`;
    zoneLabel.style.background = `color-mix(in srgb, ${resolveColor(zone.color)} 20%, transparent)`;
    zoneLabel.style.color = resolveColor(zone.color);
    wattsResult.style.color = resolveColor(zone.color);
    wattsResult.style.textShadow = `0 0 24px color-mix(in srgb, ${resolveColor(zone.color)} 45%, transparent)`;

    // Marqueur sur la jauge
    gaugeMarker.style.left = (percent / GAUGE_MAX * 100) + '%';

    // Etat actif des segments
    document.querySelectorAll('.gauge-seg').forEach(seg=>{
      seg.classList.toggle('active', seg.dataset.key === zone.key);
    });

    // Mise à jour des watts + w/kg + surbrillance dans le tableau, en fonction de LA FTP ACTUELLE
    ZONES.forEach(z=>{
      const row = zoneTable.querySelector(`.zone-row[data-key="${z.key}"]`);
      const wLow = Math.round(ftp * z.min / 100);
      const wHigh = z.max === 200 ? null : Math.round(ftp * z.max / 100);
      row.querySelector('[data-watts]').textContent = wHigh === null
        ? `${wLow}+ W`
        : `${wLow}–${wHigh} W`;
      row.querySelector('[data-wkg]').textContent = weight > 0
        ? (wHigh === null
            ? `${(wLow/weight).toFixed(1)}+`
            : `${(wLow/weight).toFixed(1)}–${(wHigh/weight).toFixed(1)}`)
        : '—';
      row.classList.toggle('current', z.key === zone.key);
    });
  }

  function resolveColor(cssVar){
    // cssVar est du type "var(--z2)" -> on résout la vraie valeur hex
    const name = cssVar.match(/--[\w-]+/)[0];
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function nudge(delta){
    let v = parseFloat(percentInput.value) || 0;
    v = Math.min(GAUGE_MAX, Math.max(0, v + delta));
    percentInput.value = v;
    calculate();
  }

  document.getElementById('minus5').addEventListener('click', ()=>nudge(-5));
  document.getElementById('minus1').addEventListener('click', ()=>nudge(-1));
  document.getElementById('plus1').addEventListener('click', ()=>nudge(1));
  document.getElementById('plus5').addEventListener('click', ()=>nudge(5));

  ftpInput.addEventListener('input', calculate);
  weightInput.addEventListener('input', calculate);
  percentInput.addEventListener('input', calculate);

  calculate();

  // Enregistrement du service worker pour le mode hors-ligne (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err => {
        console.warn('Service worker non enregistré :', err);
      });
    });
  }
</script>

</body>
</html>
